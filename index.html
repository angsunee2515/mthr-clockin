<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MT HR Clock-In</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px 20px; background-color: #f4f6f9; color: #333; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        .btn { background-color: #06C755; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 25px; cursor: pointer; width: 100%; font-weight: bold; }
        #status { margin-top: 15px; color: #666; font-size: 14px; }
    </style>
</head>
<body>

<div class="card">
    <h2>MT HR Connect</h2>
    <p>ยินดีต้อนรับพนักงานทุกท่าน</p>
    <button id="btn-clockin" class="btn">กดบันทึกเวลาเข้างาน (Clock In)</button>
    <p id="status">ระบบพร้อมบันทึกเวลาและพิกัดของคุณ</p>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
    async function initLiff() {
        try {
            await liff.init({ liffId: "2010214347-gbhKImBf" });

            if (!liff.isLoggedIn()) {
                liff.login();
            } else {
                document.getElementById('btn-clockin').addEventListener('click', handleClockIn);
            }
        } catch (error) {
            console.error("LIFF Initialization failed", error);
            document.getElementById('status').innerText = "เกิดข้อผิดพลาดในการโหลดระบบ LINE LIFF";
        }
    }

    function handleClockIn() {
        document.getElementById('status').innerText = "กำลังดึงพิกัดตำแหน่งของคุณ...";
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(sendData, locationError, {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            });
        } else {
            document.getElementById('status').innerText = "เบราว์เซอร์ของคุณไม่รองรับการดึงพิกัด";
        }
    }

    async function sendData(position) {
        document.getElementById('status').innerText = "กำลังส่งข้อมูลไปที่หลังบ้าน...";
        try {
            const profile = await liff.getProfile();
            const payload = {
                userId: profile.userId,
                displayName: profile.displayName,
                pictureUrl: profile.pictureUrl,
                latitude: position.coords.latitude,
                longitude: position.coords.longitude,
                timestamp: new Date().toISOString()
            };

            // 👇👇👇 แก้ไขตรงนี้จุดเดียวครับ: ลบคำภาษาไทยออก แล้วเอาลิงก์จาก Make.com มาวางในเครื่องหมายคำพูด 👇👇👇
            const webhookUrl = "วางลิงก์จาก_Make_ตรงนี้ครับ";
            // 👆👆👆 ------------------------------------------------------------------------- 👆👆👆

            const response = await fetch(webhookUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                document.getElementById('status').innerText = "บันทึกเวลาและพิกัดสำเร็จเรียบร้อยแล้ว!";
                alert("บันทึกเวลาสำเร็จ!");
                liff.closeWindow();
            } else {
                throw new Error("Server responded with error");
            }
        } catch (error) {
            console.error("Error sending data", error);
            document.getElementById('status').innerText = "ส่งข้อมูลล้มเหลว";
            alert("เกิดข้อผิดพลาดในการส่งข้อมูลไปที่หลังบ้าน");
        }
    }

    function locationError(error) {
        console.error("Location error", error);
        document.getElementById('status').innerText = "ไม่สามารถดึงพิกัดได้ กรุณาเปิด GPS และอนุญาตสิทธิ์เข้าถึงตำแหน่ง";
        alert("กรุณาเปิด GPS และอนุญาตให้แอปเข้าถึงตำแหน่งที่ตั้งของคุณ");
    }

    initLiff();
</script>

</body>
</html>
