<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>ระบบตอกบัตร</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
body {
    margin: 0;
    padding: 20px;
    font-family: sans-serif;
    text-align: center;
    background: #f5f5f5;
}

.card {
    max-width: 400px;
    margin: 70px auto 0;
    padding: 32px 24px;
    background: #ffffff;
    border: 1px solid #dddddd;
    border-radius: 16px;
    box-shadow: 0 5px 18px rgba(0,0,0,0.10);
}

.icon {
    margin-bottom: 12px;
    font-size: 65px;
}

h2 {
    margin: 10px 0 30px;
    color: #222222;
}

.btn {
    width: 100%;
    padding: 18px;
    color: #ffffff;
    background: #06C755;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 20px;
    font-weight: bold;
}

.btn:disabled {
    background: #aaaaaa;
    cursor: not-allowed;
}

.note {
    margin-top: 20px;
    color: #777777;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="card">

    <div class="icon">⏰</div>

    <h2>ระบบตอกบัตรเข้างาน</h2>

    <button
        type="button"
        class="btn"
        id="clockInBtn"
        onclick="clockIn()"
        disabled>
        กำลังเปิดระบบ...
    </button>

    <div class="note">
        กดตอกบัตรได้วันละ 1 ครั้ง
    </div>

</div>

<script>
const WEBHOOK_URL =
    "https://hook.eu1.make.com/mjthdfbofhwaaxjai15ktaga2yw9f4qb";

const LIFF_ID =
    "2010214347-gbhKImBf";

let userId = "";
let displayName = "";


/* อ่านส่วนประกอบวันเวลาประเทศไทย */
function getBangkokDateTime() {

    const now = new Date();

    const parts =
        new Intl.DateTimeFormat(
            "en-GB",
            {
                timeZone: "Asia/Bangkok",
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hour12: false
            }
        ).formatToParts(now);

    const values = {};

    parts.forEach(function(part) {
        values[part.type] = part.value;
    });

    const dateKey =
        values.year +
        "-" +
        values.month +
        "-" +
        values.day;

    const timeOnly =
        values.hour +
        ":" +
        values.minute +
        ":" +
        values.second;

    const timeThai =
        values.day +
        "/" +
        values.month +
        "/" +
        values.year +
        " " +
        timeOnly;

    return {
        now: now,
        dateKey: dateKey,
        timeOnly: timeOnly,
        timeThai: timeThai
    };
}


/* ตรวจสอบมาทันหรือสาย */
function getArrivalStatus(timeOnly) {

    if (timeOnly <= "09:00:00") {
        return "มาทัน";
    }

    return "สาย";
}


/* เปลี่ยนข้อความและสถานะของปุ่ม */
function setButton(text, disabled) {

    const btn =
        document.getElementById(
            "clockInBtn"
        );

    btn.innerText = text;
    btn.disabled = disabled;
}


/* เริ่มต้นระบบ LINE LIFF */
async function initializeLiff() {

    try {

        await liff.init({
            liffId: LIFF_ID
        });

        if (!liff.isLoggedIn()) {
            liff.login();
            return;
        }

        /*
         * อ่านข้อมูล LINE เบื้องหลัง
         * ไม่แสดงให้พนักงานเห็น
         */
        const profile =
            await liff.getProfile();

        userId =
            profile.userId || "";

        displayName =
            profile.displayName || "";

        if (!userId) {
            throw new Error(
                "ไม่พบ LINE User ID"
            );
        }

        setButton(
            "ตอกบัตรเข้างาน",
            false
        );

    } catch (error) {

        console.error(
            "LIFF error:",
            error
        );

        setButton(
            "เปิดระบบไม่สำเร็จ",
            true
        );

        await Swal.fire({
            icon: "error",
            title: "เปิดระบบไม่สำเร็จ",
            text:
                "กรุณาปิดหน้าต่าง แล้วเปิดระบบจาก LINE ใหม่"
        });
    }
}


/* กระบวนการตอกบัตร */
async function clockIn() {

    if (!userId) {

        await Swal.fire({
            icon: "error",
            title: "ไม่พบข้อมูล LINE",
            text:
                "กรุณาปิดหน้าต่าง แล้วเปิดระบบจาก LINE ใหม่"
        });

        return;
    }

    const bangkok =
        getBangkokDateTime();

    const arrivalStatus =
        getArrivalStatus(
            bangkok.timeOnly
        );

    /*
     * LINE User ID + วันที่
     * ใช้เป็นรหัสรายการตอกบัตร
     */
    const attendanceKey =
        userId +
        "_" +
        bangkok.dateKey;

    const storageKey =
        "clockin_" +
        attendanceKey;

    /*
     * ตรวจสอบการตอกซ้ำในเครื่องเดิม
     */
    const previousClockIn =
        localStorage.getItem(
            storageKey
        );

    if (previousClockIn) {

        let previousData = {};

        try {

            previousData =
                JSON.parse(
                    previousClockIn
                );

        } catch (error) {

            previousData = {};
        }

        await Swal.fire({
            icon: "warning",
            title: "ตอกบัตรแล้ว",
            html:
                "วันนี้คุณตอกบัตรเรียบร้อยแล้ว" +
                (
                    previousData.timeThai
                        ? "<br>เวลา: " +
                          previousData.timeThai
                        : ""
                ),
            confirmButtonText: "ตกลง"
        });

        return;
    }

    setButton(
        "กำลังตรวจสอบตำแหน่ง...",
        true
    );

    if (!navigator.geolocation) {

        await Swal.fire({
            icon: "error",
            title:
                "อุปกรณ์ไม่รองรับ GPS"
        });

        setButton(
            "ตอกบัตรเข้างาน",
            false
        );

        return;
    }

    navigator.geolocation.getCurrentPosition(

        async function(position) {

            try {

                setButton(
                    "กำลังส่งข้อมูล...",
                    true
                );

                /*
                 * อ่านข้อมูล LINE อีกครั้ง
                 */
                const profile =
                    await liff.getProfile();

                userId =
                    profile.userId || "";

                displayName =
                    profile.displayName || "";

                /*
                 * ข้อมูลที่ส่งไป Make
                 * แต่ไม่แสดงบนหน้าจอพนักงาน
                 */
                const payload = {

                    userId: userId,

                    displayName:
                        displayName,

                    employeeId: "",

                    status: "เข้างาน",

                    latitude:
                        position.coords.latitude,

                    longitude:
                        position.coords.longitude,

                    accuracy:
                        position.coords.accuracy,

                    timestamp:
                        bangkok.now.toISOString(),

                    timeThai:
                        bangkok.timeThai,

                    attendanceDate:
                        bangkok.dateKey,

                    attendanceTime:
                        bangkok.timeOnly,

                    summaryStatus:
                        arrivalStatus,

                    attendanceKey:
                        attendanceKey,

                    source: "LIFF"
                };

                console.log(
                    "Sending payload:",
                    payload
                );

                const response =
                    await fetch(
                        WEBHOOK_URL,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(
                                    payload
                                )
                        }
                    );

                if (!response.ok) {

                    if (
                        response.status === 409
                    ) {

                        throw new Error(
                            "DUPLICATE"
                        );
                    }

                    throw new Error(
                        "HTTP " +
                        response.status
                    );
                }

                /*
                 * บันทึกว่าตอกบัตรแล้ว
                 */
                localStorage.setItem(
                    storageKey,
                    JSON.stringify({
                        timeThai:
                            bangkok.timeThai,

                        summaryStatus:
                            arrivalStatus
                    })
                );

                await Swal.fire({
                    icon: "success",
                    title:
                        "ตอกบัตรสำเร็จ",
                    text:
                        "บันทึกเวลาเรียบร้อยแล้ว",
                    timer: 2000,
                    showConfirmButton: false
                });

                if (liff.isInClient()) {
                    liff.closeWindow();
                }

            } catch (error) {

                console.error(
                    "Clock-in error:",
                    error
                );

                if (
                    error.message ===
                    "DUPLICATE"
                ) {

                    await Swal.fire({
                        icon: "warning",
                        title:
                            "ตอกบัตรแล้ว",
                        text:
                            "วันนี้คุณตอกบัตรเรียบร้อยแล้ว"
                    });

                } else {

                    await Swal.fire({
                        icon: "error",
                        title:
                            "ส่งข้อมูลไม่สำเร็จ",
                        text:
                            error.message
                    });
                }

                setButton(
                    "ตอกบัตรเข้างาน",
                    false
                );
            }
        },

        async function(error) {

            let message =
                "กรุณาเปิด GPS แล้วลองใหม่";

            if (error.code === 1) {
                message =
                    "กรุณาอนุญาตให้ระบบเข้าถึงตำแหน่ง";
            }

            if (error.code === 2) {
                message =
                    "ไม่สามารถตรวจหาตำแหน่งได้";
            }

            if (error.code === 3) {
                message =
                    "ค้นหาตำแหน่งใช้เวลานานเกินไป";
            }

            await Swal.fire({
                icon: "warning",
                title:
                    "ไม่สามารถใช้ GPS",
                text: message
            });

            setButton(
                "ตอกบัตรเข้างาน",
                false
            );
        },

        {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
        }
    );
}


/* เริ่มระบบ */
initializeLiff();
</script>

</body>
</html>
