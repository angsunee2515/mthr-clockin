<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>ระบบตอกบัตร</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
body {
    margin: 0;
    padding: 20px;
    font-family: sans-serif;
    text-align: center;
    background: #f5f5f5;
}

.card {
    max-width: 400px;
    margin: 60px auto 0;
    padding: 30px 24px;
    background: white;
    border: 1px solid #ddd;
    border-radius: 16px;
    box-shadow: 0 5px 18px rgba(0,0,0,0.10);
}

.icon {
    margin-bottom: 10px;
    font-size: 65px;
}

h2 {
    margin: 10px 0 25px;
    color: #222;
}

.btn {
    width: 100%;
    padding: 18px;
    color: white;
    background: #06C755;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 20px;
    font-weight: bold;
}

.btn:disabled {
    background: #aaa;
    cursor: not-allowed;
}

.note {
    margin-top: 20px;
    color: #777;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="card">

    <div class="icon">⏰</div>

    <h2>ระบบตอกบัตรเข้างาน</h2>

    <button
        type="button"
        class="btn"
        id="clockInBtn"
        onclick="clockIn()"
        disabled>
        กำลังเปิดระบบ...
    </button>

    <div class="note">
        กดตอกบัตรได้วันละ 1 ครั้ง
    </div>

</div>

<script>
const WEBHOOK_URL =
    "https://hook.eu1.make.com/mjthdfbofhwaaxjai15ktaga2yw9f4qb";

const LIFF_ID =
    "2010214347-gbhKImBf";

let userId = "";
let displayName = "";


/* สร้างวันที่ตามเวลาไทย */
function getThaiDateKey() {

    return new Intl.DateTimeFormat(
        "en-CA",
        {
            timeZone: "Asia/Bangkok",
            year: "numeric",
            month: "2-digit",
            day: "2-digit"
        }
    ).format(new Date());
}


/* ตั้งค่าปุ่ม */
function setButton(
    text,
    disabled
) {

    const btn =
        document.getElementById(
            "clockInBtn"
        );

    btn.innerText = text;
    btn.disabled = disabled;
}


/* เริ่มระบบ LINE LIFF */
async function initializeLiff() {

    try {

        await liff.init({
            liffId: LIFF_ID
        });

        if (!liff.isLoggedIn()) {
            liff.login();
            return;
        }

        /*
         * อ่านข้อมูล LINE เบื้องหลัง
         * แต่ไม่แสดงให้พนักงานเห็น
         */
        const profile =
            await liff.getProfile();

        userId =
            profile.userId || "";

        displayName =
            profile.displayName || "";

        if (!userId) {
            throw new Error(
                "ไม่พบ LINE User ID"
            );
        }

        setButton(
            "ตอกบัตรเข้างาน",
            false
        );

    } catch (error) {

        console.error(error);

        setButton(
            "เปิดระบบไม่สำเร็จ",
            true
        );

        await Swal.fire({
            icon: "error",
            title: "เปิดระบบไม่สำเร็จ",
            text:
                "กรุณาปิดหน้าต่าง แล้วเปิดจาก LINE ใหม่อีกครั้ง"
        });
    }
}


/* ตอกบัตรเข้างาน */
async function clockIn() {

    if (!userId) {

        await Swal.fire({
            icon: "error",
            title: "ไม่พบข้อมูล LINE",
            text:
                "กรุณาปิดหน้าต่าง แล้วเปิดจาก LINE ใหม่"
        });

        return;
    }

    const attendanceDate =
        getThaiDateKey();

    /*
     * ใช้ LINE User ID และวันที่
     * เป็นรหัสป้องกันการตอกซ้ำ
     */
    const attendanceKey =
        userId +
        "_" +
        attendanceDate;

    const storageKey =
        "clockin_" +
        attendanceKey;

    const previousClockIn =
        localStorage.getItem(
            storageKey
        );

    /*
     * ป้องกันการตอกซ้ำ
     * บนโทรศัพท์และ LINE เดิม
     */
    if (previousClockIn) {

        let previousData = {};

        try {
            previousData =
                JSON.parse(
                    previousClockIn
                );
        } catch (error) {
            previousData = {};
        }

        await Swal.fire({
            icon: "warning",
            title: "ตอกบัตรแล้ว",
            html:
                "วันนี้คุณตอกบัตรเรียบร้อยแล้ว" +
                (
                    previousData.timeThai
                        ? "<br>เวลา: " +
                          previousData.timeThai
                        : ""
                ),
            confirmButtonText: "ตกลง"
        });

        return;
    }

    setButton(
        "กำลังตรวจสอบตำแหน่ง...",
        true
    );

    if (!navigator.geolocation) {

        await Swal.fire({
            icon: "error",
            title:
                "อุปกรณ์ไม่รองรับ GPS"
        });

        setButton(
            "ตอกบัตรเข้างาน",
            false
        );

        return;
    }

    navigator.geolocation.getCurrentPosition(

        async function(position) {

            try {

                setButton(
                    "กำลังส่งข้อมูล...",
                    true
                );

                /*
                 * อ่านข้อมูล LINE ใหม่อีกครั้ง
                 */
                const profile =
                    await liff.getProfile();

                userId =
                    profile.userId || "";

                displayName =
                    profile.displayName || "";

                const now =
                    new Date();

                const timeThai =
                    now.toLocaleString(
                        "th-TH",
                        {
                            timeZone:
                                "Asia/Bangkok"
                        }
                    );

                /*
                 * ข้อมูลทั้งหมดส่งไป Make
                 * แต่ไม่แสดงบนหน้าจอพนักงาน
                 */
                const payload = {
                    userId: userId,
                    lineUserId: userId,

                    displayName:
                        displayName,

                    employeeId: "",

                    status: "เข้างาน",
                    action: "เข้างาน",

                    latitude:
                        position.coords.latitude,

                    longitude:
                        position.coords.longitude,

                    accuracy:
                        position.coords.accuracy,

                    timestamp:
                        now.toISOString(),

                    timeThai:
                        timeThai,

                    attendanceDate:
                        attendanceDate,

                    attendanceKey:
                        attendanceKey,

                    source: "LIFF"
                };

                const response =
                    await fetch(
                        WEBHOOK_URL,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(
                                    payload
                                )
                        }
                    );

                if (!response.ok) {

                    if (response.status === 409) {
                        throw new Error(
                            "DUPLICATE"
                        );
                    }

                    throw new Error(
                        "HTTP " +
                        response.status
                    );
                }

                /*
                 * บันทึกว่าตอกบัตรแล้ว
                 * หลัง Make รับข้อมูลสำเร็จ
                 */
                localStorage.setItem(
                    storageKey,
                    JSON.stringify({
                        timeThai:
                            timeThai
                    })
                );

                await Swal.fire({
                    icon: "success",
                    title:
                        "ตอกบัตรสำเร็จ",
                    text:
                        "บันทึกเวลาเรียบร้อยแล้ว",
                    timer: 2000,
                    showConfirmButton: false
                });

                if (liff.isInClient()) {
                    liff.closeWindow();
                }

            } catch (error) {

                console.error(error);

                if (
                    error.message ===
                    "DUPLICATE"
                ) {

                    await Swal.fire({
                        icon: "warning",
                        title:
                            "ตอกบัตรแล้ว",
                        text:
                            "วันนี้คุณตอกบัตรเรียบร้อยแล้ว"
                    });

                } else {

                    await Swal.fire({
                        icon: "error",
                        title:
                            "ส่งข้อมูลไม่สำเร็จ",
                        text:
                            error.message
                    });
                }

                setButton(
                    "ตอกบัตรเข้างาน",
                    false
                );
            }
        },

        async function(error) {

            let message =
                "กรุณาเปิด GPS แล้วลองใหม่";

            if (error.code === 1) {
                message =
                    "กรุณาอนุญาตให้ระบบเข้าถึงตำแหน่ง";
            }

            if (error.code === 2) {
                message =
                    "ไม่สามารถตรวจหาตำแหน่งได้";
            }

            if (error.code === 3) {
                message =
                    "ค้นหาตำแหน่งใช้เวลานานเกินไป";
            }

            await Swal.fire({
                icon: "warning",
                title:
                    "ไม่สามารถใช้ GPS",
                text: message
            });

            setButton(
                "ตอกบัตรเข้างาน",
                false
            );
        },

        {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
        }
    );
}


/* เริ่มต้นระบบ */
initializeLiff();
</script>

</body>
</html>
