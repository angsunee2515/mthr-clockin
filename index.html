<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>ระบบตอกบัตร</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
body {
    font-family: sans-serif;
    text-align: center;
    padding: 20px;
    background: #f5f5f5;
}

.card {
    max-width: 400px;
    margin: auto;
    padding: 24px;
    background: white;
    border: 1px solid #ddd;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

h2 {
    margin-top: 0;
}

input {
    width: 100%;
    padding: 12px;
    margin: 15px 0;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 18px;
    text-align: center;
}

.btn {
    width: 100%;
    padding: 15px;
    background: #06C755;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 18px;
    font-weight: bold;
}

.btn:disabled {
    background: #aaa;
    cursor: not-allowed;
}
</style>
</head>

<body>

<div class="card">

    <h2>ตอกบัตรเข้างาน</h2>

    <input
        type="text"
        id="empId"
        inputmode="numeric"
        placeholder="กรอกรหัสพนักงาน 2 ตัว เช่น 04"
        maxlength="2">

    <button
        type="button"
        class="btn"
        id="submitBtn"
        onclick="processClockIn()">
        กดเพื่อตอกบัตร
    </button>

</div>

<script>
const WEBHOOK_URL =
    "https://hook.eu1.make.com/mjthdfbofhwaaxjai15ktaga2yw9f4qb";

const LIFF_ID = "2010214347-gbhKImBf";

let lineUserId = "";
let displayName = "";


/* เริ่มต้นระบบ LIFF */
async function initializeLiff() {

    try {

        await liff.init({
            liffId: LIFF_ID
        });

        if (!liff.isLoggedIn()) {
            liff.login();
            return;
        }

        const profile = await liff.getProfile();

        lineUserId = profile.userId || "";
        displayName = profile.displayName || "";

    } catch (error) {

        console.error(
            "LIFF initialization failed:",
            error
        );

        await Swal.fire({
            icon: "error",
            title: "เปิดระบบไม่สำเร็จ",
            text: "กรุณาปิดหน้าต่าง แล้วเปิดระบบจาก LINE ใหม่อีกครั้ง"
        });
    }
}


/* เริ่มกระบวนการตอกบัตร */
async function processClockIn() {

    const empIdInput =
        document.getElementById("empId");

    const btn =
        document.getElementById("submitBtn");

    const empId =
        empIdInput.value.trim();

    /* ตรวจรหัสพนักงาน */
    if (!/^\d{2}$/.test(empId)) {

        await Swal.fire({
            icon: "warning",
            title: "กรุณากรอกรหัสพนักงาน",
            text: "กรอกตัวเลขให้ครบ 2 ตัว เช่น 04"
        });

        return;
    }

    /* ตรวจสอบการเข้าสู่ระบบ LINE */
    if (!liff.isLoggedIn()) {
        liff.login();
        return;
    }

    btn.disabled = true;
    btn.innerText = "กำลังตรวจสอบตำแหน่ง...";

    /* ตรวจสอบว่าเครื่องรองรับ GPS หรือไม่ */
    if (!navigator.geolocation) {

        await Swal.fire({
            icon: "error",
            title: "อุปกรณ์ไม่รองรับ GPS"
        });

        resetButton();
        return;
    }

    /* ขอพิกัด GPS */
    navigator.geolocation.getCurrentPosition(

        async function(position) {

            btn.innerText = "กำลังส่งข้อมูล...";

            try {

                /*
                 * อ่านข้อมูล LINE อีกครั้ง
                 * เพื่อป้องกันกรณีหน้าเว็บโหลดข้อมูลไม่ทัน
                 */
                const profile =
                    await liff.getProfile();

                lineUserId =
                    profile.userId || "";

                displayName =
                    profile.displayName || "";

                const now =
                    new Date();

                /*
                 * ชื่อฟิลด์ต้องตรงกับฟิลด์ใน Make
                 */
                const payload = {
                    userId: lineUserId,
                    displayName: displayName,
                    employeeId: "MT" + empId,
                    status: "เข้างาน",
                    latitude:
                        position.coords.latitude,
                    longitude:
                        position.coords.longitude,
                    accuracy:
                        position.coords.accuracy,
                    timestamp:
                        now.toISOString(),
                    timeThai:
                        now.toLocaleString(
                            "th-TH",
                            {
                                timeZone:
                                    "Asia/Bangkok"
                            }
                        ),
                    source: "LIFF"
                };

                console.log(
                    "Sending payload:",
                    payload
                );

                const response =
                    await fetch(
                        WEBHOOK_URL,
                        {
                            method: "POST",
                            headers: {
                                "Content-Type":
                                    "application/json"
                            },
                            body:
                                JSON.stringify(
                                    payload
                                )
                        }
                    );

                if (!response.ok) {
                    throw new Error(
                        "HTTP " +
                        response.status
                    );
                }

                await Swal.fire({
                    icon: "success",
                    title: "ตอกบัตรสำเร็จ",
                    html:
                        "รหัสพนักงาน: MT" +
                        empId +
                        "<br>เวลา: " +
                        payload.timeThai,
                    timer: 2200,
                    showConfirmButton: false
                });

                empIdInput.value = "";

                if (liff.isInClient()) {
                    liff.closeWindow();
                }

            } catch (error) {

                console.error(
                    "ส่งข้อมูลไม่สำเร็จ:",
                    error
                );

                await Swal.fire({
                    icon: "error",
                    title: "ส่งข้อมูลไม่สำเร็จ",
                    text: error.message
                });

                resetButton();
            }
        },

        async function(error) {

            let message =
                "กรุณาเปิด GPS แล้วลองใหม่";

            if (error.code === 1) {
                message =
                    "กรุณาอนุญาตให้ระบบเข้าถึงตำแหน่ง";
            }

            if (error.code === 2) {
                message =
                    "ไม่สามารถตรวจหาตำแหน่งได้";
            }

            if (error.code === 3) {
                message =
                    "ค้นหาตำแหน่งใช้เวลานานเกินไป";
            }

            await Swal.fire({
                icon: "warning",
                title: "ไม่สามารถใช้ GPS",
                text: message
            });

            resetButton();
        },

        {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
        }
    );
}


/* คืนสถานะปุ่ม */
function resetButton() {

    const btn =
        document.getElementById("submitBtn");

    btn.disabled = false;
    btn.innerText = "กดเพื่อตอกบัตร";
}


/* เริ่มระบบ */
initializeLiff();
</script>

</body>
</html>
