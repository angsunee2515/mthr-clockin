<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบตอกบัตรพนักงานออนไลน์</title>
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f4f6f9; padding: 20px; color: #333; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        h2 { text-align: center; color: #06C755; margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin-top: 15px; margin-bottom: 5px; font-size: 14px; text-align: left; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; box-sizing: border-box; font-family: inherit; margin-bottom: 15px; }
        .btn-checkin { width: 100%; padding: 15px; background-color: #06C755; color: white; border: none; border-radius: 50px; font-size: 18px; font-weight: bold; margin-top: 10px; cursor: pointer; box-shadow: 0 4px 10px rgba(6, 199, 85, 0.3); }
        .btn-checkin:disabled { background-color: #a5d6a7; cursor: not-allowed; }
        .profile-img { width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 15px; display: block; object-fit: cover; border: 3px solid #06C755; }
        .profile-name { font-weight: bold; font-size: 18px; color: #2e7d32; text-align: center; margin-bottom: 5px; }
        .status-text { font-size: 14px; color: #666; text-align: center; margin-bottom: 20px; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>

<div class="card">
    <h2>ตอกบัตรเข้า-ออกงาน</h2>
    
    <div id="profileBox" style="display: none;">
        <img id="profileImg" class="profile-img" src="" alt="Profile">
        <div class="profile-name" id="displayName">กำลังโหลดชื่อ...</div>
        <div class="status-text" id="gpsStatus">📡 กำลังตรวจสอบสัญญาณ GPS...</div>
    </div>

    <form id="clockInForm" onsubmit="event.preventDefault(); processCheckIn();">
        <label for="employeeId">รหัสพนักงาน (กรอกเฉพาะตัวเลข 2 ตัว):</label>
        <input type="text" id="employeeId" placeholder="เช่น 01 หรือ 12" required pattern="[0-9]{2}" title="กรุณากรอกตัวเลข 2 ตัวค่ะ">
        
        <button type="submit" class="btn-checkin" id="checkinBtn" disabled>กดเพื่อตอกบัตรเข้างาน</button>
    </form>
</div>

<script>
    let userName = "";
    let userId = "";
    
    // 🏷️ รหัสคำนำหน้า
    const PREFIX = "MT";

    const COMPANY_LAT = 13.9280625;
    const COMPANY_LON = 100.4831272;
    const CLOCKIN_WEBHOOK_URL = "https://hook.eu1.make.com/5rax8wzcpb4abo8f1l9s06edxrri78gq"; 
    
    // 🔴 รหัส LIFF ID ของหน้าตอกบัตร 🔴
    const LIFF_ID = "2010214347-gbhKImBf"; 

    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371000; 
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon / 2) * Math.sin(dLon / 2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return R * c; 
    }

    async function initLiff() {
        try {
            await liff.init({ liffId: LIFF_ID });
            if (liff.isLoggedIn()) {
                const profile = await liff.getProfile();
                userName = profile.displayName;
                userId = profile.userId;
                
                document.getElementById('profileImg').src = profile.pictureUrl || 'https://via.placeholder.com/80';
                document.getElementById('displayName').innerText = "คุณ " + userName;
                document.getElementById('profileBox').style.display = "block";
                
                document.getElementById('checkinBtn').disabled = false;
                document.getElementById('gpsStatus').innerText = "📌 สัญญาณ GPS พร้อมใช้งาน";
            } else {
                liff.login();
            }
        } catch (error) {
            console.error("LIFF Init Error:", error);
        }
    }

    function processCheckIn() {
        const btn = document.getElementById("checkinBtn");
        btn.innerText = "กำลังตรวจพิกัด...";
        btn.disabled = true;

        navigator.geolocation.getCurrentPosition(async function(position) {
            const userLat = position.coords.latitude;
            const userLon = position.coords.longitude;
            const distance = calculateDistance(userLat, userLon, COMPANY_LAT, COMPANY_LON);
            
            if (distance > 999999) {
                Swal.fire({ title: 'ตอกบัตรไม่สำเร็จ!', text: 'คุณอยู่ห่างจากบริษัทเกินไป', icon: 'error', confirmButtonColor: '#d33' });
                btn.innerText = "กดเพื่อตอกบัตรเข้างาน";
                btn.disabled = false;
            } else {
                sendDataToMake(userLat, userLon);
            }
        }, function(error) {
            Swal.fire('ตอกบัตรล้มเหลว', 'กรุณาเปิดสิทธิ์เข้าถึงตำแหน่งก่อนนะคะ', 'error');
            btn.innerText = "กดเพื่อตอกบัตรเข้างาน";
            btn.disabled = false;
        }, { enableHighAccuracy: true, timeout: 5000 });
    }

    async function sendDataToMake(lat, lon) {
        const rawInput = document.getElementById("employeeId").value.trim();
        const fullEmployeeId = PREFIX + rawInput;

        const payload = {
            userId: userId,
            displayName: userName,
            employeeId: fullEmployeeId, 
            status: "เข้างาน",
            latitude: lat,
            longitude: lon,
            timestamp: new Date().toLocaleString('th-TH')
        };

        try {
            const response = await fetch(CLOCKIN_WEBHOOK_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                Swal.fire({ title: 'ตอกบัตรสำเร็จ!', text: 'บันทึกรหัส ' + fullEmployeeId + ' เรียบร้อยค่ะ', icon: 'success', confirmButtonColor: '#06C755' })
                .then(() => liff.closeWindow());
            } else {
                throw new Error("Network response error");
            }
        } catch (error) {
            Swal.fire('ข้อผิดพลาด!', 'ไม่สามารถส่งข้อมูลได้ กรุณาลองใหม่', 'error');
            document.getElementById("checkinBtn").innerText = "กดเพื่อตอกบัตรเข้างาน";
            document.getElementById("checkinBtn").disabled = false;
        }
    }

    initLiff();
</script>
</body>
</html>
