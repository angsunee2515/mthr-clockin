<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ระบบตอกบัตร</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        .card { max-width: 400px; margin: auto; border: 1px solid #ccc; padding: 20px; border-radius: 10px; }
        input { width: 100%; padding: 10px; margin: 10px 0; }
        .btn { width: 100%; padding: 15px; background-color: #06C755; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>ตอกบัตรเข้างาน</h2>
        <input type="text" id="empId" placeholder="รหัสพนักงาน" maxlength="2">
        <button class="btn" id="submitBtn" onclick="process()">กดเพื่อตอกบัตร</button>
    </div>

<script>
    // ส่งตรงเข้าเซิร์ฟเวอร์ n8n ไม่ต้องผ่าน ngrok
    const WEBHOOK_URL = "http://217.15.166.151:5678/webhook-test/ee5ba937-ff47-4b4d-8214-bfc64d91552f";

    async function process() {
        const empId = document.getElementById("empId").value;
        if (!empId) { alert('กรุณากรอกรหัส'); return; }
        
        const btn = document.getElementById("submitBtn");
        btn.innerText = "กำลังส่ง...";
        btn.disabled = true;

        navigator.geolocation.getCurrentPosition(async (pos) => {
            const payload = {
                employeeId: "MT" + empId,
                lat: pos.coords.latitude,
                lon: pos.coords.longitude,
                time: new Date().toLocaleString('th-TH')
            };

            try {
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                alert('บันทึกสำเร็จ!');
                liff.closeWindow();
            } catch (e) {
                alert('ส่งข้อมูลสำเร็จ');
                liff.closeWindow();
            }
        }, () => {
            alert('กรุณาเปิด GPS');
            btn.innerText = "กดเพื่อตอกบัตร";
            btn.disabled = false;
        }, { enableHighAccuracy: true });
    }

    liff.init({ liffId: "2010214347-gbhKImBf" });
</script>
</body>
</html>
