<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ระบบตอกบัตร</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
body{
    font-family:sans-serif;
    text-align:center;
    padding:20px;
}

.card{
    max-width:400px;
    margin:auto;
    border:1px solid #ccc;
    border-radius:10px;
    padding:20px;
}

input{
    width:100%;
    padding:10px;
    margin:10px 0;
    box-sizing:border-box;
}

.btn{
    width:100%;
    padding:15px;
    background:#06C755;
    color:#fff;
    border:none;
    border-radius:5px;
    cursor:pointer;
}
</style>

</head>
<body>

<div class="card">
    <h2>ตอกบัตรเข้างาน</h2>

    <input
        type="text"
        id="empId"
        placeholder="รหัสพนักงาน"
        maxlength="2">

    <button
        class="btn"
        id="submitBtn"
        onclick="process()">
        กดเพื่อตอกบัตร
    </button>
</div>

<script>

// ******** แก้ตรงนี้แล้ว ********
const WEBHOOK_URL = "https://kitty-rendering-tranquil.ngrok-free.dev/webhook/clockin";

async function process(){

    const empId=document.getElementById("empId").value;

    if(!empId){
        Swal.fire({
            icon:"warning",
            title:"กรุณากรอกรหัสพนักงาน"
        });
        return;
    }

    const btn=document.getElementById("submitBtn");
    btn.disabled=true;
    btn.innerText="กำลังส่ง...";

    navigator.geolocation.getCurrentPosition(async(pos)=>{

        const payload={
            employeeId:"MT"+empId,
            latitude:pos.coords.latitude,
            longitude:pos.coords.longitude,
            time:new Date().toLocaleString("th-TH"),
            source:"LIFF"
        };

        try{

            const res=await fetch(WEBHOOK_URL,{
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify(payload)
            });

            if(!res.ok){
                throw new Error("HTTP "+res.status);
            }

            Swal.fire({
                icon:"success",
                title:"ตอกบัตรสำเร็จ",
                timer:1500,
                showConfirmButton:false
            }).then(()=>{
                if(liff.isInClient()){
                    liff.closeWindow();
                }
            });

        }catch(err){

            Swal.fire({
                icon:"error",
                title:"ส่งข้อมูลไม่สำเร็จ",
                text:err.message
            });

            btn.disabled=false;
            btn.innerText="กดเพื่อตอกบัตร";
        }

    },()=>{

        Swal.fire({
            icon:"warning",
            title:"กรุณาเปิด GPS"
        });

        btn.disabled=false;
        btn.innerText="กดเพื่อตอกบัตร";

    },{
        enableHighAccuracy:true
    });

}

async function main(){
    await liff.init({
        liffId:"2010214347-gbhKImBf"
    });
}

main();

</script>

</body>
</html>
