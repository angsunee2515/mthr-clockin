<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MT HR Clock-In</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px 20px; background-color: #f4f6f9; color: #333; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        .btn { background-color: #06C755; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 25px; cursor: pointer; width: 100%; font-weight: bold; }
        #status { margin-top: 15px; color: #666; font-size: 14px; }
    </style>
</head>
<body>

<div class="card">
    <h2>MT HR Connect</h2>
    <p>ยินดีต้อนรับพนักงานทุกท่าน</p>
    <button id="btn-clockin" class="btn">กดบันทึกเวลาเข้างาน (Clock In)</button>
    <p id="status">ระบบพร้อมบันทึกเวลาและพิกัดของคุณ</p>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
    async function initLiff() {
        try {
            await liff.init({ liffId: "2010214347-gbhKImBf" });
            if (!liff.isLoggedIn()) {
                liff.login();
            } else {
                document.getElementById('btn-clockin').addEventListener('click', handleClockIn);
            }
        } catch (error) {
            document.getElementById('status').innerText = "เกิดข้อผิดพลาดในการโหลดระบบ LINE LIFF";
        }
    }

    function handleClockIn() {
        document.getElementById('btn-clockin').disabled = true;
        document.getElementById('status').innerText = "กำลังค้นหาพิกัด GPS (รอสักครู่)...";
        
        if (navigator.geolocation) {
            // ปรับให้รอ GPS นานขึ้นเป็น 10 วินาที
            navigator.geolocation.getCurrentPosition(
                (pos) => sendData(pos.coords.latitude, pos.coords.longitude),
                () => sendData("-", "-"), 
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        } else {
            sendData("-", "-");
        }
    }

    async function sendData(lat, lng) {
        document.getElementById('status').innerText = "กำลังส่งข้อมูลเข้าตาราง...";
        try {
            const profile = await liff.getProfile();
            const payload = {
                userId: profile.userId,
                displayName: profile.displayName,
                pictureUrl: profile.pictureUrl,
                latitude: lat,
                longitude: lng,
                timestamp: new Date().toISOString()
            };

            const webhookUrl = "https://hook.eu1.make.com/5rax8wzcpb4abo8f1l9s06edxrrij92n";

            const response = await fetch(webhookUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                document.getElementById('status').innerText = "บันทึกเวลาสำเร็จเรียบร้อยแล้ว!";
                alert("บันทึกเวลาสำเร็จ!");
                liff.closeWindow();
            } else {
                throw new Error("Server Error");
            }
        } catch (error) {
            document.getElementById('status').innerText = "เกิดข้อผิดพลาดในการส่งข้อมูล กรุณาลองใหม่";
            document.getElementById('btn-clockin').disabled = false;
        }
    }

    initLiff();
</script>

</body>
</html>
