<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ระบบตอกบัตร</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>body{font-family:sans-serif; text-align:center; padding:20px;}</style>
</head>
<body>
    <h2>ตอกบัตรเข้างาน</h2>
    <input type="text" id="empId" placeholder="รหัสพนักงาน (04)" style="padding:10px; font-size:18px;">
    <br><br>
    <button onclick="sendData()" style="padding:15px 30px; background:#06C755; color:white; border:none; border-radius:20px; font-size:18px;">ส่งข้อมูลตอกบัตร</button>

<script>
    async function sendData() {
        await liff.init({ liffId: "2010214347-gbhKImBf" });
        const profile = await liff.getProfile();
        const empId = document.getElementById("empId").value;
        
        const payload = {
            date: new Date().toLocaleDateString('th-TH'),
            time: new Date().toLocaleTimeString('th-TH'),
            displayName: profile.displayName,
            employeeId: "MT" + empId,
            status: "เข้างาน"
        };

        fetch("https://hook.eu1.make.com/5rax8wzcpb4abo8f1l9s06edxrrij92n", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(payload)
        }).then(() => {
            Swal.fire('สำเร็จ!', 'ข้อมูลส่งไปแล้วค่ะ', 'success').then(() => liff.closeWindow());
        });
    }
</script>
</body>
</html>
