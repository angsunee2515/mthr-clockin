<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MT HR Clock-In</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px 20px; background-color: #f4f6f9; color: #333; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        #status { font-size: 16px; font-weight: bold; color: #e67e22; margin-top: 20px;}
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #06C755; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

<div class="card">
    <h2>MT HR Connect</h2>
    <div id="loading-spinner" class="loader"></div>
    <p id="status">ขั้นที่ 1: เตรียมระบบ...</p>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
    const today = new Date().toLocaleDateString('th-TH');

    async function initLiff() {
        try {
            document.getElementById('status').innerText = "ขั้นที่ 2: กำลังเชื่อมต่อ LINE...";
            await liff.init({ liffId: "2010214347-gbhKImBf" });
            
            document.getElementById('status').innerText = "ขั้นที่ 3: เช็คสถานะล็อกอิน...";
            if (!liff.isLoggedIn()) {
                liff.login();
            } else {
                checkDuplicateClockIn();
            }
        } catch (error) {
            document.getElementById('status').innerText = "Error ขั้นที่ 2: รหัส LIFF มีปัญหา";
            document.getElementById('loading-spinner').style.display = 'none';
        }
    }

    function checkDuplicateClockIn() {
        document.getElementById('status').innerText = "ขั้นที่ 4: เช็คการลงเวลาซ้ำ...";
        const lastClockInDate = localStorage.getItem('lastClockInDate');
        
        if (lastClockInDate === today) {
            document.getElementById('loading-spinner').style.display = 'none';
            document.getElementById('status').innerText = "คุณลงเวลาของวันนี้ไปแล้ว";
            Swal.fire({
                title: 'ลงเวลาซ้ำ!',
                text: 'คุณได้ลงเวลาเข้างานของวันนี้ไปแล้วค่ะ (ไม่ลงเวลาซ้ำนะคะ)',
                icon: 'warning',
                confirmButtonText: 'ตกลง',
                confirmButtonColor: '#f39c12'
            }).then(() => { liff.closeWindow(); });
        } else {
            autoClockIn();
        }
    }

    function autoClockIn() {
        document.getElementById('status').innerText = "ขั้นที่ 5: กำลังขอพิกัด GPS...";
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => sendData(pos.coords.latitude, pos.coords.longitude),
                (err) => sendData("-", "-"), 
                { enableHighAccuracy: false, timeout: 4000, maximumAge: 60000 }
            );
        } else {
            sendData("-", "-");
        }
    }

    async function sendData(lat, lng) {
        try {
            document.getElementById('status').innerText = "ขั้นที่ 6: กำลังส่งเข้าตาราง...";
            const profile = await liff.getProfile();
            
            const now = new Date();
            const payload = {
                userId: profile.userId,
                displayName: profile.displayName,
                pictureUrl: profile.pictureUrl,
                latitude: lat,
                longitude: lng,
                date: now.toLocaleDateString('th-TH'), 
                time: now.toLocaleTimeString('th-TH')  
            };

            const webhookUrl = "https://hook.eu1.make.com/5rax8wzcpb4abo8f1l9s06edxrrij92n";

            const response = await fetch(webhookUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                localStorage.setItem('lastClockInDate', today);
                document.getElementById('status').innerText = "สำเร็จ 100%!";
                document.getElementById('loading-spinner').style.display = 'none';
                
                Swal.fire({
                    title: 'สำเร็จ!',
                    text: 'บันทึกเวลาเข้างานเรียบร้อย',
                    icon: 'success',
                    showConfirmButton: false,
                    timer: 2000
                }).then(() => { liff.closeWindow(); });
            } else {
                throw new Error("Server Error");
            }
        } catch (error) {
            document.getElementById('status').innerText = "Error ขั้นที่ 6: ส่งข้อมูลไม่สำเร็จ";
            document.getElementById('loading-spinner').style.display = 'none';
        }
    }

    initLiff();
</
