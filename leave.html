<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>ระบบใบลาออนไลน์</title>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
body {
    margin: 0;
    padding: 20px;
    font-family: "Sarabun", sans-serif;
    color: #333;
    background: #f4f6f9;
}

.card {
    max-width: 430px;
    margin: auto;
    padding: 24px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.10);
}

h2 {
    margin: 0 0 20px;
    color: #06C755;
    text-align: center;
}

.status-box {
    margin-bottom: 18px;
    padding: 10px;
    color: #555;
    text-align: center;
    background: #f1f8e9;
    border-radius: 8px;
    font-size: 14px;
}

.menu {
    display: grid;
    gap: 10px;
    margin-bottom: 20px;
}

.menu-button {
    width: 100%;
    padding: 13px;
    color: #06C755;
    background: #fff;
    border: 2px solid #06C755;
    border-radius: 9px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
}

.menu-button.active {
    color: #fff;
    background: #06C755;
}

.menu-button:disabled {
    color: #fff;
    background: #aaa;
    border-color: #aaa;
}

.section {
    display: none;
}

.section.active {
    display: block;
}

label {
    display: block;
    margin-top: 14px;
    margin-bottom: 6px;
    font-size: 14px;
    font-weight: bold;
}

select,
input,
textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 11px;
    font-family: inherit;
    font-size: 15px;
    background: #fff;
    border: 1px solid #ccc;
    border-radius: 8px;
}

textarea {
    height: 90px;
    resize: vertical;
}

.submit-button {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    color: #fff;
    background: #06C755;
    border: none;
    border-radius: 9px;
    cursor: pointer;
    font-size: 17px;
    font-weight: bold;
}

.submit-button:disabled {
    background: #aaa;
}

.balance-card {
    display: none;
    margin-top: 18px;
    padding: 15px;
    background: #f1f8e9;
    border-radius: 10px;
}

.balance-row {
    display: flex;
    justify-content: space-between;
    padding: 9px 0;
    border-bottom: 1px solid #dce8d7;
}

.balance-row:last-child {
    border-bottom: none;
}

.note {
    margin-top: 16px;
    color: #777;
    text-align: center;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="card">

    <h2>ระบบใบลาออนไลน์</h2>

    <div
        class="status-box"
        id="systemStatus">
        กำลังตรวจสอบข้อมูล LINE...
    </div>

    <div class="menu">

        <button
            type="button"
            class="menu-button active"
            id="newLeaveMenu"
            onclick="showSection('newLeave')"
            disabled>
            ยื่นใบลาใหม่
        </button>

        <button
            type="button"
            class="menu-button"
            id="changeLeaveMenu"
            onclick="showSection('changeLeave')"
            disabled>
            ขอเปลี่ยนวันลา
        </button>

        <button
            type="button"
            class="menu-button"
            id="balanceMenu"
            onclick="showSection('balance')"
            disabled>
            ตรวจสอบวันลาคงเหลือ
        </button>

    </div>


    <!-- ยื่นใบลาใหม่ -->
    <section
        class="section active"
        id="newLeave">

        <form id="newLeaveForm">

            <label for="leaveType">
                ประเภทการลา
            </label>

            <select
                id="leaveType"
                required>

                <option
                    value=""
                    disabled
                    selected>
                    -- เลือกประเภทการลา --
                </option>

                <option value="ลากิจ">
                    ลากิจ
                </option>

                <option value="ลาป่วย">
                    ลาป่วย
                </option>

                <option value="ลาพักร้อน">
                    ลาพักร้อน
                </option>

            </select>

            <label for="startDate">
                วันที่เริ่มลา
            </label>

            <input
                type="date"
                id="startDate"
                required>

            <label for="endDate">
                วันที่สิ้นสุดการลา
            </label>

            <input
                type="date"
                id="endDate"
                required>

            <label for="totalDays">
                จำนวนวันลารวม
            </label>

            <input
                type="number"
                id="totalDays"
                min="0.5"
                step="0.5"
                placeholder="เช่น 1 หรือ 1.5"
                required>

            <label for="reason">
                เหตุผลการลา
            </label>

            <textarea
                id="reason"
                placeholder="ระบุเหตุผลการลา..."
                required></textarea>

            <button
                type="submit"
                class="submit-button"
                id="newLeaveSubmit">
                ส่งใบลา
            </button>

        </form>

    </section>


    <!-- ขอเปลี่ยนวันลา -->
    <section
        class="section"
        id="changeLeave">

        <form id="changeLeaveForm">

            <label for="leaveNumber">
                เลขที่ใบลาเดิม
            </label>

            <input
                type="text"
                id="leaveNumber"
                placeholder="กรอกเลขที่ใบลาเดิม"
                required>

            <label for="newStartDate">
                วันที่เริ่มลาใหม่
            </label>

            <input
                type="date"
                id="newStartDate"
                required>

            <label for="newEndDate">
                วันที่สิ้นสุดใหม่
            </label>

            <input
                type="date"
                id="newEndDate"
                required>

            <label for="newTotalDays">
                จำนวนวันลาใหม่
            </label>

            <input
                type="number"
                id="newTotalDays"
                min="0.5"
                step="0.5"
                placeholder="เช่น 1 หรือ 1.5"
                required>

            <label for="changeReason">
                เหตุผลที่ขอเปลี่ยน
            </label>

            <textarea
                id="changeReason"
                placeholder="ระบุเหตุผลที่ต้องการเปลี่ยนวันลา..."
                required></textarea>

            <button
                type="submit"
                class="submit-button"
                id="changeLeaveSubmit">
                ส่งคำขอเปลี่ยนวันลา
            </button>

        </form>

    </section>


    <!-- ตรวจสอบยอดวันลา -->
    <section
        class="section"
        id="balance">

        <button
            type="button"
            class="submit-button"
            id="checkBalanceButton"
            onclick="checkLeaveBalance()">
            ตรวจสอบยอดวันลา
        </button>

        <div
            class="balance-card"
            id="balanceResult">

            <div class="balance-row">
                <span>สิทธิพักร้อนทั้งหมด</span>
                <strong id="vacationTotal">-</strong>
            </div>

            <div class="balance-row">
                <span>พักร้อนที่ใช้แล้ว</span>
                <strong id="vacationUsed">-</strong>
            </div>

            <div class="balance-row">
                <span>พักร้อนคงเหลือ</span>
                <strong id="vacationRemaining">-</strong>
            </div>

            <div class="balance-row">
                <span>รายการรออนุมัติ</span>
                <strong id="vacationPending">-</strong>
            </div>

        </div>

    </section>

    <div class="note">
        ระบบอ่านข้อมูลพนักงานจากบัญชี LINE โดยอัตโนมัติ
    </div>

</div>

<script>
const LIFF_ID =
    "2010214347-3cJ4grN3";

const WEBHOOK_URL =
    "https://hook.eu1.make.com/yi5ctmlgjvtkg14kq4y81vd9yjbqh64s";

let userId = "";
let displayName = "";


/* วันที่ตามเวลาประเทศไทย */
function getBangkokDate() {

    return new Intl.DateTimeFormat(
        "en-CA",
        {
            timeZone: "Asia/Bangkok",
            year: "numeric",
            month: "2-digit",
            day: "2-digit"
        }
    ).format(new Date());
}


/* วันและเวลาไทย */
function getBangkokDateTime() {

    const parts =
        new Intl.DateTimeFormat(
            "en-GB",
            {
                timeZone: "Asia/Bangkok",
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hour12: false
            }
        ).formatToParts(
            new Date()
        );

    const values = {};

    parts.forEach(function(part) {
        values[part.type] = part.value;
    });

    return (
        values.day +
        "/" +
        values.month +
        "/" +
        values.year +
        " " +
        values.hour +
        ":" +
        values.minute +
        ":" +
        values.second
    );
}


/* สร้างเลขที่ใบลา */
function createLeaveNumber() {

    const datePart =
        getBangkokDate()
        .replaceAll("-", "");

    const timePart =
        String(
            Date.now()
        ).slice(-6);

    return (
        "LV" +
        datePart +
        timePart
    );
}


/* เปิดเมนู */
function enableMenus(enabled) {

    document
        .querySelectorAll(
            ".menu-button"
        )
        .forEach(function(button) {
            button.disabled = !enabled;
        });
}


/* เปลี่ยนเมนู */
function showSection(sectionId) {

    document
        .querySelectorAll(".section")
        .forEach(function(section) {
            section.classList.remove(
                "active"
            );
        });

    document
        .querySelectorAll(
            ".menu-button"
        )
        .forEach(function(button) {
            button.classList.remove(
                "active"
            );
        });

    document
        .getElementById(sectionId)
        .classList.add("active");

    if (sectionId === "newLeave") {
        document
            .getElementById(
                "newLeaveMenu"
            )
            .classList.add("active");
    }

    if (sectionId === "changeLeave") {
        document
            .getElementById(
                "changeLeaveMenu"
            )
            .classList.add("active");
    }

    if (sectionId === "balance") {
        document
            .getElementById(
                "balanceMenu"
            )
            .classList.add("active");
    }
}


/* ล็อกวันที่ย้อนหลัง */
function lockPastDates() {

    const today =
        getBangkokDate();

    [
        "startDate",
        "endDate",
        "newStartDate",
        "newEndDate"
    ].forEach(function(id) {

        document
            .getElementById(id)
            .min = today;
    });
}


/* ตรวจสอบวันที่ */
function datesAreValid(
    startDate,
    endDate
) {

    return (
        startDate &&
        endDate &&
        endDate >= startDate
    );
}


/* ส่งข้อมูลไป Make */
async function sendToMake(payload) {

    const response =
        await fetch(
            WEBHOOK_URL,
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify(
                        payload
                    )
            }
        );

    let result = null;

    try {
        result =
            await response.json();
    } catch (error) {
        result = null;
    }

    if (!response.ok) {

        if (
            response.status === 409
        ) {
            throw new Error(
                "DUPLICATE"
            );
        }

        if (
            response.status === 404
        ) {
            throw new Error(
                "NOT_FOUND"
            );
        }

        throw new Error(
            "HTTP " +
            response.status
        );
    }

    return result;
}


/* เริ่มระบบ LINE LIFF */
async function initializeLiff() {

    const systemStatus =
        document.getElementById(
            "systemStatus"
        );

    try {

        await liff.init({
            liffId: LIFF_ID
        });

        if (!liff.isLoggedIn()) {
            liff.login();
            return;
        }

        const profile =
            await liff.getProfile();

        userId =
            profile.userId || "";

        displayName =
            profile.displayName || "";

        if (!userId) {
            throw new Error(
                "ไม่พบ LINE User ID"
            );
        }

        lockPastDates();
        enableMenus(true);

        systemStatus.innerText =
            "ระบบพร้อมใช้งาน";

    } catch (error) {

        console.error(error);

        enableMenus(false);

        systemStatus.innerText =
            "ไม่สามารถเปิดระบบได้";

        await Swal.fire({
            icon: "error",
            title:
                "เปิดระบบไม่สำเร็จ",
            text:
                "กรุณาปิดหน้าต่าง แล้วเปิดจาก LINE ใหม่"
        });
    }
}


/* ส่งใบลาใหม่ */
document
    .getElementById(
        "newLeaveForm"
    )
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const button =
                document.getElementById(
                    "newLeaveSubmit"
                );

            const leaveType =
                document.getElementById(
                    "leaveType"
                ).value;

            const startDate =
                document.getElementById(
                    "startDate"
                ).value;

            const endDate =
                document.getElementById(
                    "endDate"
                ).value;

            const totalDays =
                document.getElementById(
                    "totalDays"
                ).value;

            const reason =
                document.getElementById(
                    "reason"
                ).value.trim();

            if (
                !datesAreValid(
                    startDate,
                    endDate
                )
            ) {

                await Swal.fire({
                    icon: "warning",
                    title:
                        "วันที่ไม่ถูกต้อง",
                    text:
                        "วันที่สิ้นสุดต้องไม่น้อยกว่าวันที่เริ่มลา"
                });

                return;
            }

            const duplicateKey =
                userId +
                "_" +
                leaveType +
                "_" +
                startDate +
                "_" +
                endDate;

            if (
                localStorage.getItem(
                    "leave_" +
                    duplicateKey
                )
            ) {

                await Swal.fire({
                    icon: "warning",
                    title:
                        "ส่งใบลานี้แล้ว",
                    text:
                        "ไม่สามารถส่งรายการเดิมซ้ำได้"
                });

                return;
            }

            button.disabled = true;
            button.innerText =
                "กำลังส่งข้อมูล...";

            const leaveNumber =
                createLeaveNumber();

            const payload = {

                action:
                    "create_leave",

                leaveNumber:
                    leaveNumber,

                userId:
                    userId,

                displayName:
                    displayName,

                employeeId: "",

                leaveType:
                    leaveType,

                startDate:
                    startDate,

                endDate:
                    endDate,

                totalDays:
                    Number(totalDays),

                reason:
                    reason,

                leaveStatus:
                    "รออนุมัติ",

                duplicateKey:
                    duplicateKey,

                timestamp:
                    new Date()
                    .toISOString(),

                timeThai:
                    getBangkokDateTime(),

                source:
                    "LIFF"
            };

            try {

                await sendToMake(
                    payload
                );

                localStorage.setItem(
                    "leave_" +
                    duplicateKey,
                    leaveNumber
                );

                await Swal.fire({
                    icon: "success",
                    title:
                        "ส่งใบลาสำเร็จ",
                    html:
                        "เลขที่ใบลา: " +
                        leaveNumber +
                        "<br>สถานะ: รออนุมัติ",
                    confirmButtonColor:
                        "#06C755"
                });

                document
                    .getElementById(
                        "newLeaveForm"
                    )
                    .reset();

            } catch (error) {

                console.error(error);

                await Swal.fire({
                    icon: "error",
                    title:
                        "ส่งข้อมูลไม่สำเร็จ",
                    text:
                        "กรุณาลองใหม่อีกครั้ง"
                });

            } finally {

                button.disabled = false;
                button.innerText =
                    "ส่งใบลา";
            }
        }
    );


/* ขอเปลี่ยนวันลา */
document
    .getElementById(
        "changeLeaveForm"
    )
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const button =
                document.getElementById(
                    "changeLeaveSubmit"
                );

            const leaveNumber =
                document.getElementById(
                    "leaveNumber"
                ).value.trim();

            const newStartDate =
                document.getElementById(
                    "newStartDate"
                ).value;

            const newEndDate =
                document.getElementById(
                    "newEndDate"
                ).value;

            const newTotalDays =
                document.getElementById(
                    "newTotalDays"
                ).value;

            const changeReason =
                document.getElementById(
                    "changeReason"
                ).value.trim();

            if (
                !datesAreValid(
                    newStartDate,
                    newEndDate
                )
            ) {

                await Swal.fire({
                    icon: "warning",
                    title:
                        "วันที่ไม่ถูกต้อง",
                    text:
                        "วันที่สิ้นสุดต้องไม่น้อยกว่าวันที่เริ่มลา"
                });

                return;
            }

            button.disabled = true;
            button.innerText =
                "กำลังส่งคำขอ...";

            const payload = {

                action:
                    "change_leave",

                leaveNumber:
                    leaveNumber,

                userId:
                    userId,

                displayName:
                    displayName,

                newStartDate:
                    newStartDate,

                newEndDate:
                    newEndDate,

                newTotalDays:
                    Number(
                        newTotalDays
                    ),

                changeReason:
                    changeReason,

                changeStatus:
                    "รออนุมัติการแก้ไข",

                timestamp:
                    new Date()
                    .toISOString(),

                timeThai:
                    getBangkokDateTime(),

                source:
                    "LIFF"
            };

            try {

                await sendToMake(
                    payload
                );

                await Swal.fire({
                    icon: "success",
                    title:
                        "ส่งคำขอสำเร็จ",
                    text:
                        "ส่งคำขอเปลี่ยนวันลาให้ผู้อนุมัติแล้ว",
                    confirmButtonColor:
                        "#06C755"
                });

                document
                    .getElementById(
                        "changeLeaveForm"
                    )
                    .reset();

            } catch (error) {

                console.error(error);

                await Swal.fire({
                    icon: "error",
                    title:
                        "ส่งคำขอไม่สำเร็จ",
                    text:
                        "กรุณาตรวจสอบเลขที่ใบลาแล้วลองใหม่"
                });

            } finally {

                button.disabled = false;
                button.innerText =
                    "ส่งคำขอเปลี่ยนวันลา";
            }
        }
    );


/* ตรวจสอบยอดวันลา */
async function checkLeaveBalance() {

    const button =
        document.getElementById(
            "checkBalanceButton"
        );

    button.disabled = true;
    button.innerText =
        "กำลังตรวจสอบ...";

    const payload = {

        action:
            "check_balance",

        userId:
            userId,

        displayName:
            displayName,

        year:
            getBangkokDate()
            .slice(0,4),

        timestamp:
            new Date()
            .toISOString(),

        source:
            "LIFF"
    };

    try {

        const result =
            await sendToMake(
                payload
            );

        if (
            !result ||
            !result.balance
        ) {

            throw new Error(
                "NO_BALANCE"
            );
        }

        document
            .getElementById(
                "vacationTotal"
            )
            .innerText =
                result.balance
                .vacationTotal ?? 0;

        document
            .getElementById(
                "vacationUsed"
            )
            .innerText =
                result.balance
                .vacationUsed ?? 0;

        document
            .getElementById(
                "vacationRemaining"
            )
            .innerText =
                result.balance
                .vacationRemaining ?? 0;

        document
            .getElementById(
                "vacationPending"
            )
            .innerText =
                result.balance
                .vacationPending ?? 0;

        document
            .getElementById(
                "balanceResult"
            )
            .style.display =
                "block";

    } catch (error) {

        console.error(error);

        await Swal.fire({
            icon: "error",
            title:
                "ตรวจสอบยอดไม่ได้",
            text:
                "กรุณาตั้งค่าเส้นทาง check_balance ใน Make ก่อน"
        });

    } finally {

        button.disabled = false;
        button.innerText =
            "ตรวจสอบยอดวันลา";
    }
}


/* เริ่มระบบ */
initializeLiff();
</script>

</body>
</html>
